<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riftbound Heist – CA Riftbound TCG Store Finder</title>
<meta name="description" content="Find California game stores listed as Riftbound TCG retailers near your ZIP.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22303a;--mute:#66737d;--line:#e3dfd6;--acc:#2f5d62;--acc2:#e8f0ef;--warn:#8a6d1f;--warnbg:#f6eed6;--gray:#eceae5}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--acc)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#banner{display:none;background:#9b2c2c;color:#fff;padding:10px 16px;font-weight:600;text-align:center}
#hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:min-height .3s}
.searched #hero{min-height:0;padding:16px;border-bottom:1px solid var(--line);background:var(--card)}
#f{display:flex;gap:10px;width:100%;max-width:520px}
#zip{flex:1;min-width:0;font-size:22px;padding:14px 18px;min-height:60px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
#zip:focus{outline:none;border-color:var(--acc)}
#go{font-size:18px;font-weight:600;padding:0 22px;min-height:60px;border:0;border-radius:14px;background:var(--acc);color:#fff;cursor:pointer;white-space:nowrap}
.searched #zip,.searched #go{min-height:48px;font-size:17px}
#err{color:#9b2c2c;min-height:24px;margin-top:10px;text-align:center}
#results{display:none}.searched #results{display:block}
.bar{max-width:1400px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.legend{color:var(--mute);font-size:14px;flex:1;min-width:200px}
.toggle{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.toggle button{min-height:44px;min-width:76px;border:0;background:#fff;color:var(--ink);font-size:15px;cursor:pointer}
.toggle button[aria-pressed=true]{background:var(--acc);color:#fff}
.layout{max-width:1400px;margin:0 auto;padding:14px 16px 24px}
#list{display:flex;flex-direction:column;gap:12px}
#mapwrap{display:none;height:70svh;border-radius:14px;overflow:hidden;border:1px solid var(--line)}#map{height:100%}
.showmap #list,.showmap #more{display:none}.showmap #mapwrap{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.card h3{margin:0;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.dist{color:var(--mute);font-size:14px;white-space:nowrap}.meta{color:var(--mute);font-size:14px;margin:4px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--acc2);color:var(--acc)}
.badge.likely{background:var(--warnbg);color:var(--warn)}.badge.unconfirmed{background:var(--gray);color:var(--mute)}
.actions{display:flex;gap:10px}.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
details.more{margin-top:10px}details.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--mute);font-size:14px}
.dl{font-size:14px;color:var(--ink)}.dl p{margin:6px 0}.dl ul{margin:4px 0;padding-left:18px}.dl li{margin:4px 0;overflow-wrap:anywhere}.muted{color:var(--mute)}
#more{display:none;margin:16px auto 0;min-height:48px;padding:0 28px;border-radius:12px;border:1px solid var(--acc);background:#fff;color:var(--acc);font-weight:600;font-size:16px;cursor:pointer}
.sec{max-width:1400px;margin:0 auto;padding:0 16px 16px}
.sec details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px}.sec summary{min-height:52px;display:flex;align-items:center;cursor:pointer;font-weight:600}
#news{padding-left:18px;margin:0 0 14px}#news li{margin:8px 0;overflow-wrap:anywhere}
footer{text-align:center;color:var(--mute);font-size:13px;padding:8px 16px 28px}
@media(min-width:900px){.toggle{display:none}.layout{display:grid;grid-template-columns:420px 1fr;gap:20px;align-items:start}
 #listcol{max-height:calc(100vh - 170px);overflow:auto;padding-right:4px}#mapwrap,.showmap #mapwrap{display:block;position:sticky;top:16px;height:calc(100vh - 170px)}.showmap #list{display:flex}.showmap #more{display:block}}
</style></head><body>
<div id="banner">⚠️ Sample data, not real stores</div>
<section id="hero"><h1 class="sr">Riftbound Heist: find Riftbound TCG stores in California</h1>
<form id="f" role="search"><label class="sr" for="zip">California ZIP code</label><input id="zip" placeholder="Enter a CA ZIP code" maxlength="5" inputmode="numeric" autocomplete="postal-code"><button id="go">Find stores</button></form>
<div id="err" role="alert"></div></section>
<section id="results">
<div class="bar"><div class="legend">Badges show retailer listing, not stock. Stock is unverified — call ahead.</div>
<div class="toggle" role="group" aria-label="View"><button id="vList" aria-pressed="true">List</button><button id="vMap" aria-pressed="false">Map</button></div></div>
<div class="layout" id="layout"><div id="listcol"><div id="list"></div><button id="more">Show more</button></div><div id="mapwrap"><div id="map"></div></div></div>
</section>
<div class="sec" id="newsbox"><details><summary>Latest Riftbound news</summary><ul id="news"></ul></details></div>
<footer><a href="https://playriftbound.com/events" target="_blank" rel="noopener">Official Riftbound events</a> · Not affiliated with Riot Games · <span id="upd"></span></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const EVENTS='https://playriftbound.com/events',PAGE=10;
const STATUS={confirmed:['Listed retailer',''],likely:['Likely retailer','likely'],unconfirmed:['Unconfirmed retailer','unconfirmed']};
let zips={},stores=[],results=[],shown=0,map,cluster,here,ready;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'#';
const mi=(a,b,c,d)=>{const r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 7917.6*Math.asin(Math.sqrt(h))};
function locate(s){if(typeof s.lat==='number'&&typeof s.lng==='number')return{pos:[s.lat,s.lng],kind:'exact'};
 const z=String(s.zip||'').slice(0,5);return zips[z]?{pos:zips[z],kind:'approx'}:{pos:null,kind:'pending'}}
ready=Promise.all([fetch('ca-zips.json').then(r=>r.json()),fetch('stores.json',{cache:'no-store'}).then(r=>r.json())]).then(([z,d])=>{
 zips=z;stores=Array.isArray(d)?d:(d.stores||[]);if(d.sample||!stores.length)$('banner').style.display='block';
 const up=d.updated||d.generated;if(up)$('upd').textContent='Data updated '+up;
 const news=(d.news||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
 if(!news.length)$('newsbox').style.display='none';
 $('news').innerHTML=news.map(n=>`<li><span class="muted">${esc(n.date||'undated')}</span> · <a href="${esc(safeUrl(n.source_url||n.url))}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');});
// Stock is NEVER shown as confirmed unless stockConfirmed===true AND a dated stock sighting exists.
const stockText=s=>(s.stockConfirmed===true&&s.lastSighting&&s.lastSighting.date)?`Stock confirmed (source dated ${esc(s.lastSighting.date)})`:'Stock: unverified/likely';
function dirUrl(s){const q=s.loc.kind==='exact'?s.loc.pos.join(','):[s.name,s.address,s.city,'CA',s.zip].filter(Boolean).join(', ');return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q)}
function card(s){const [label,cls]=STATUS[s.confidence]||['Retailer status unknown','unconfirmed'];
 const dist=s.d!=null?(s.loc.kind==='approx'?'~':'')+s.d.toFixed(1)+' mi':'Location pending';
 const ev=(s.riftbound_evidence||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
 const addr=[s.address,s.city,s.zip].filter(Boolean).join(', ');
 const src=ev.map(x=>`<li>${esc(x.summary)} <a href="${esc(safeUrl(x.source_url))}" target="_blank" rel="noopener">source</a> <span class="muted">(${esc(x.date||'undated')})</span></li>`).join('')||'<li class="muted">No sources listed</li>';
 const links=[s.website&&`<a href="${esc(safeUrl(s.website))}" target="_blank" rel="noopener">Website</a>`,s.phone&&`<a href="tel:${esc(s.phone)}">${esc(s.phone)}</a>`,s.locator_url&&`<a href="${esc(safeUrl(s.locator_url))}" target="_blank" rel="noopener">Locator page</a>`].filter(Boolean).join(' · ');
 return `<div class="top"><h3>${esc(s.name)}</h3><span class="dist">${dist}</span></div>
 <div class="meta">${s.city?`<span>${esc(s.city)}</span>`:''}<span class="badge ${cls}">${label}</span></div>
 <div class="actions">${s.loc.pos||addr?`<a class="btn primary" href="${dirUrl(s)}" target="_blank" rel="noopener">Directions</a>`:''}<a class="btn" href="${EVENTS}" target="_blank" rel="noopener">Events</a></div>
 <details class="more"><summary>Details</summary><div class="dl">
 ${addr?`<p>${esc(addr)}</p>`:''}${links?`<p>${links}</p>`:''}<p>${stockText(s)}</p>
 <p>Retailer status: ${esc(s.confidence||'unknown')}${s.confidence_note?' — '+esc(s.confidence_note):''}</p>
 <p class="muted">${s.loc.kind==='approx'?'Approximate location (ZIP centre)':s.loc.kind==='pending'?'Location pending':'Location'}${s.geocode_source?' · geo: '+esc(s.geocode_source):''}</p>
 <p><b>Sources</b></p><ul>${src}</ul></div></details>`}
function initMap(){if(map)return;map=L.map('map',{scrollWheelZoom:true}).setView([36.7,-119.4],6);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
 cluster=(L.markerClusterGroup?L.markerClusterGroup({chunkedLoading:true}):L.layerGroup()).addTo(map);here=L.layerGroup().addTo(map)}
function renderMore(){const el=$('list');results.slice(shown,shown+PAGE).forEach(s=>{const d=document.createElement('article');d.className='card';d.innerHTML=card(s);el.appendChild(d)});
 shown=Math.min(shown+PAGE,results.length);$('more').style.display=shown<results.length?'block':'none';$('more').textContent=`Show more (${results.length-shown} left)`}
function setView(v){document.body.classList.toggle('showmap',v==='map');$('vList').setAttribute('aria-pressed',v!=='map');$('vMap').setAttribute('aria-pressed',v==='map');if(map)setTimeout(()=>map.invalidateSize(),50)}
$('vList').onclick=()=>setView('list');$('vMap').onclick=()=>setView('map');$('more').onclick=renderMore;
$('f').onsubmit=async e=>{e.preventDefault();const z=$('zip').value.trim();$('err').textContent='';
 if(!/^\d{5}$/.test(z)||+z<90000||+z>96199){$('err').textContent='Please enter a California ZIP (90000–96199).';return}
 await ready;const c=zips[z];if(!c){$('err').textContent='We couldn’t find that ZIP in our California list.';return}
 document.body.classList.add('searched');initMap();cluster.clearLayers();here.clearLayers();
 L.circleMarker(c,{radius:8,color:'#9b2c2c',fillOpacity:.6}).addTo(here).bindPopup('ZIP '+z);
 const all=stores.map(s=>{const loc=locate(s);return{...s,loc,d:loc.pos?mi(c[0],c[1],loc.pos[0],loc.pos[1]):null}});
 results=all.filter(s=>s.loc.pos).sort((a,b)=>a.d-b.d).concat(all.filter(s=>!s.loc.pos));
 cluster.addLayers(results.filter(s=>s.loc.pos).map(s=>(s.loc.kind==='approx'?L.circleMarker(s.loc.pos,{radius:9,dashArray:'4',color:'#8a6d1f'}):L.marker(s.loc.pos)).bindPopup(`<div style="min-width:220px">${card(s)}</div>`)));
 $('list').innerHTML=results.length?'':'<p class="muted">No stores in the dataset yet.</p>';shown=0;renderMore();setView('list');
 setTimeout(()=>{map.invalidateSize();map.fitBounds(L.latLngBounds([c,...results.slice(0,5).filter(s=>s.loc.pos).map(s=>s.loc.pos)]).pad(.2))},60);};
</script></body></html>
